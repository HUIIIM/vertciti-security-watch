# Source idea: actions/starter-workflows (CI concept). Tailored for this repo.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python syntax check (py_compile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compile all Python files
        run: python -m compileall -q $(find . -name "*.py" -not -path "./.git/*") && echo "py_compile OK"
  test:
    name: Tests (pytest) + lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install "pytest==9.1.1" "ruff==0.16.9"
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests (pytest)
        run: python -m pytest -q
  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Check scripts
        run: find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 -r shellcheck -S warning
