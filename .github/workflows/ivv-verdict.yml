# ivv/verdict commit status (SOTA VER-3; #6, #22).
#
# Posts the `ivv/verdict` status on a PR's head commit from the PR's comments:
# success only for a well-formed IVV verdict comment (header with the current
# head sha and SOTA >= v1.3, machine-readable `判定: PASS`) by an OWNER /
# MEMBER / COLLABORATOR; failure for FAIL; pending otherwise. Rules:
# scripts/ivv_verdict.py. Once #22's ruleset lists `ivv/verdict` as a required
# check, a PR cannot merge without such a verdict on its current head.
#
# Hardening: pull_request_target and issue_comment always run this file and the
# script from the default branch, never from the PR, so a PR cannot edit either to
# certify itself. The PR's code is never checked out or executed. Comment text is
# only matched by the script, never interpolated into a shell.
name: IVV verdict
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
jobs:
  verdict:
    name: ivv/verdict
    if: ${{ github.event_name == 'pull_request_target' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    concurrency:
      group: ivv-verdict-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}   # never the PR's code
          persist-credentials: false
      - name: Decide and post ivv/verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$REPO/pulls/$PR")"
          head="$(jq -r .head.sha <<<"$pr_json")"
          author="$(jq -r .user.login <<<"$pr_json")"
          gh api --paginate "repos/$REPO/issues/$PR/comments" | jq -s 'add // []' > "$RUNNER_TEMP/comments.json"
          python3 -I scripts/ivv_verdict.py "$head" "$author" < "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/status.json"
          cat "$RUNNER_TEMP/status.json"
          gh api -X POST "repos/$REPO/statuses/$head" --input "$RUNNER_TEMP/status.json" --jq '"posted \(.context)=\(.state)"'
