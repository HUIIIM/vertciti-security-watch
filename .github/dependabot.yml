version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      # All github/codeql-action steps must move together: CodeQL fails when
      # init and analyze run different versions in one workflow, so per-step
      # Dependabot PRs (#29, #31) can never go green on their own.
      codeql-action:
        patterns: ["github/codeql-action*"]
